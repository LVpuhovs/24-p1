header{display:flex;align-items:center;gap:10px;margin-bottom:18px}

.tag{color:var(--mute);font-size:13px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:inherit;font:inherit;cursor:pointer;transition:.15s}
button.card:hover{border-color:var(--red);transform:translateY(-2px)}
.era .y{font-size:26px;font-weight:900;font-style:italic}.era .m{color:var(--mute);font-size:13px}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:700 15px inherit;font-family:inherit;cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.slots{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));margin-bottom:18px}
.slot{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:12px;min-height:56px}
.slot.on{border:1px solid var(--red)}.slot.f{border-style:solid;background:var(--card)}
.slot small{display:block;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;font-size:10px}
.slot strong{font-size:13px}
.opt h3{margin:0 0 2px;font-size:16px}.opt .t{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin:4px 0}.bar i{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar u{display:block;height:100%;background:var(--red)}.bar span{width:20px;text-align:right;color:var(--ink)}
.bar.r u{background:var(--grn)}
input{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;width:100%;max-width:320px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}.prog u{display:block;height:100%;background:var(--red);transition:.3s}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}@media(max-width:640px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase}
td:last-child,th:last-child{text-align:right}tr.me td{color:var(--red);font-weight:700}
.sc{overflow-x:auto}
.big{font-size:54px;font-weight:900;font-style:italic;color:var(--red);line-height:1}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0}.stats div b{display:block;font-size:22px}.stats div{color:var(--mute);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

app.innerHTML=`<h2>${era.y} · ${s.l}</h2><p class="s">Slot ${step+1} of ${SLOTS.length}. Pick one of three.</p>${sl}<div class="grid">${S.opts[step].map((o,i)=>`<button class="card opt" onclick="choose(${i})"><h3>${o.n}</h3><div class="t">${tier(o.r)}</div>${bar('Performance',o.r)}${bar(step<2?'Consistency':'Reliability',o.k,'r')}</button>`).join('')}</div>`}
function choose(i){S.team[SLOTS[S.step].k]=S.opts[S.step][i];S.step++;build()}
function startSeason(){const e=S.era,t=S.team;
const g=GRID[e.id],taken=[t.d1.n,t.d2.n],rs=g.res.filter(d=>!taken.includes(d.n));
const ai=g.t.map(x=>({...x,pts:0,w:0,d:x.d.map(d=>taken.includes(d.n)?(rs.shift()||{n:'Reserve Driver',r:60}):d)}));
const me={n:S.name,me:1,pts:0,w:0,k:(t.car.k+t.en.k+t.pc.k)/3};
const base=.3*t.car.r+.22*t.en.r+.1*t.st.r+.05*t.pc.r+.05*t.tp.r;
S.me=me;S.base=base;S.ai=ai;S.D={};ai.forEach(a=>a.d.forEach(d=>S.D[d.n]={n:d.n,t:a.n,pts:0,w:0}));[t.d1,t.d2].forEach(d=>S.D[d.n]={n:d.n,t:S.name,pts:0,w:0,me:1});S.race=0;S.log=[];S.dr={d1:{n:t.d1.n,pts:0},d2:{n:t.d2.n,pts:0}};S.stat={wins:0,pod:0,dnf:0,best:99};S.last=null;sim()}
function runRace(){const e=S.era,t=S.team,cars=[];
const add=(team,name,s,k,isMe,key,c)=>{const dnf=Math.random()<e.dnf*(1.6-(k*.75+c*.25)/70),sg=(1.5+(100-c)*.2)*(isMe?1.2-t.st.r/250:1);cars.push({team,name,isMe,key,dnf,sc:dnf?-1e9+Math.random():s*3.5+G()*sg*2})};
S.ai.forEach(a=>a.d.forEach(d=>add(a,d.n,.72*a.s+.28*d.r+R(-3,3),a.k,0,0,cons(d.n,d.r))));
['d1','d2'].forEach(d=>add(S.me,t[d].n,S.base+.28*t[d].r+R(-3,3),S.me.k,1,d,t[d].k));
cars.sort((a,b)=>b.sc-a.sc);
cars.forEach((c,i)=>{c.pos=i+1;const p=c.dnf?0:(e.pts[i]||0);c.p=p;c.team.pts+=p;const D=S.D[c.name];D.pts+=p;if(i==0&&!c.dnf)D.w++;if(c.isMe)S.dr[c.key].pts+=p;
if(i==0&&!c.dnf)c.team.w++;
if(c.isMe){if(c.dnf)S.stat.dnf++;else{S.stat.best=Math.min(S.stat.best,c.pos);if(c.pos==1)S.stat.wins++;if(c.pos<=3)S.stat.pod++}}});
S.last=cars;S.race++}
const all=()=>[...S.ai,S.me].sort((a,b)=>b.pts-a.pts||b.w-a.w);
const alld=()=>Object.values(S.D).sort((a,b)=>b.pts-a.pts||b.w-a.w);
const dtb=()=>`<div class="sc"><table><tr><th>#</th><th>Driver</th><th>Pts</th></tr>${alld().map((x,i)=>`<tr class="${x.me?'me':''}"><td>${i+1}</td><td>${x.n} <span class="tag">${x.t}</span></td><td>${x.pts}</td></tr>`).join('')}</table></div>`;
function sim(){const e=S.era,done=S.race>=e.races,L=S.last,st=all();
const tbl=st.map((x,i)=>`<tr class="${x.me?'me':''}"><td>${i+1}</td><td>${x.n}</td><td>${x.pts}</td></tr>`).join('');
const res=L?L.slice(0,10).map(c=>`<tr class="${c.isMe?'me':''}"><td>${c.pos}</td><td>${c.name}${c.dnf?' (DNF)':''}</td><td>${c.team.n}</td><td>${c.p}</td></tr>`).join(''):'';
const mine=L?L.filter(c=>c.isMe).map(c=>`${S.team[c.key].n}: ${c.dnf?'DNF':'P'+c.pos}`).join(' · '):'';
if(done)return final();
app.innerHTML=`<div class="top"><div><h2>${S.name}</h2><span class="tag">${e.y} season · Race ${S.race} / ${e.races}${S.race<e.races?' · next: '+TRACKS[S.race%24]+' GP':''}</span></div><div class="row" style="margin:0"><button class="btn" onclick="runRace();sim()">Next race</button><button class="btn g" onclick="while(S.race<S.era.races)runRace();sim()">Sim to end</button></div></div>
<div class="prog"><u style="width:${S.race/e.races*100}%"></u></div>
<div class="two"><div class="card"><b>${L?TRACKS[(S.race-1)%24]+' GP · top 10':'Awaiting lights out'}</b>${L?`<div class="sc"><table><tr><th>Pos</th><th>Driver</th><th>Team</th><th>Pts</th></tr>${res}</table></div><p class="tag">Your cars — ${mine}</p>`:'<p class="s">Press Next race to start your season.</p>'}</div>
<div class="card"><b>Constructors’ standings</b><div class="sc"><table><tr><th>#</th><th>Team</th><th>Pts</th></tr>${tbl}</table></div></div></div>
<div class="card" style="margin-top:12px"><b>Drivers’ standings</b>${dtb()}</div>`}
function final(){const st=all(),pos=st.indexOf(S.me)+1,e=S.era,sfx=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:Math.min(n%10,4)%4]||'th');
const champ=pos==1;
S.txt=`🏁 24-P1 · ${e.y} season\n${S.name} finished ${sfx(pos)} in the Constructors’ Championship${champ?' 🏆':''}\n${S.me.pts} pts · ${S.stat.wins} wins · ${S.stat.pod} podiums · ${S.stat.dnf} DNFs\nDrivers: ${S.team.d1.n} (${S.dr.d1.pts}) & ${S.team.d2.n} (${S.dr.d2.pts})\nCan you beat me?`;
const tbl=st.map((x,i)=>`<tr class="${x.me?'me':''}"><td>${i+1}</td><td>${x.n}</td><td>${x.pts}</td></tr>`).join('');
app.innerHTML=`<p class="tag">${e.y} season complete</p><div class="big">${champ?'CHAMPIONS':sfx(pos)}</div><h2 style="margin-top:6px">${S.name}</h2>
<div class="stats"><div><b>${S.me.pts}</b>points</div><div><b>${S.stat.wins}</b>wins</div><div><b>${S.stat.pod}</b>podiums</div><div><b>${S.stat.best==99?'–':'P'+S.stat.best}</b>best finish</div><div><b>${S.stat.dnf}</b>DNFs</div></div>
<div class="two"><div class="card"><b>Constructors’ final</b><div class="sc"><table><tr><th>#</th><th>Team</th><th>Pts</th></tr>${tbl}</table></div></div>
<div class="card"><b>Your drivers</b><div class="sc"><table><tr><th>Driver</th><th></th><th>Pts</th></tr><tr><td>${S.dr.d1.n}</td><td></td><td>${S.dr.d1.pts}</td></tr><tr><td>${S.dr.d2.n}</td><td></td><td>${S.dr.d2.pts}</td></tr></table></div><pre style="white-space:pre-wrap;font:inherit;font-size:13px;color:var(--mute);margin:12px 0 0">${S.txt}</pre></div></div>
<div class="card" style="margin-top:12px"><b>Drivers’ final standings</b>${dtb()}</div>
<div class="row"><button class="btn" id="sh" onclick="share()">Share result</button><button class="btn g" onclick="home()">New season</button></div>`}
async function share(){const b=$('#sh');try{if(navigator.share){await navigator.share({title:'24-P1',text:S.txt});return}}catch(e){if(e&&e.name==='AbortError')return}
try{await navigator.clipboard.writeText(S.txt);b.textContent='Copied to clipboard ✓'}catch(e){b.textContent='Select the text above to copy'}}
home();
</script></body></html>
